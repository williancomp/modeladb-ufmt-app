name: CI

on:
  push:
  pull_request:

jobs:
  # No service containers here: `services:` runs only on Linux runners. Windows and macOS runs are
  # best effort; the project itself has only run the checks on macOS and Linux.
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium

  # The database-backed evaluation needs the service containers, which exist only on Linux.
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_PASSWORD: evalpw
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
        env:
          MYSQL_ROOT_PASSWORD: evalpw
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pevalpw" --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
        env:
          MARIADB_ROOT_PASSWORD: evalpw
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      EVAL_POSTGRES_PORT: 5432
      EVAL_MYSQL_PORT: 3306
      EVAL_MARIADB_PORT: 3307
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run evaluate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: evaluation/results/
